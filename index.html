const KEY='intizam_v1';
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!state||!state.centers){state={centers:{'مركز زينب بنت العوام':structuredClone(INITIAL)},center:'مركز زينب بنت العوام',days:{},reasons:{},holidays:{},threshold:3}}
state.reasons ||= {};state.holidays ||= {};state.days ||= {};state.threshold ||= 3;
let tab='home',chosenDate=new Date().toLocaleDateString('en-CA'),chosenGroup='الأمهات',search='';
const groups=()=>Object.keys(state.centers[state.center]||{}), people=g=>state.centers[state.center][g]||[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=(date,g)=>JSON.stringify([state.center,g,date]);
const rec=(date,g)=>state.days[id(date,g)];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('تعذر الحفظ على الجهاز. صدّري نسخة احتياطية الآن.');return false}};
const hdate=d=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura',{day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'))}catch(e){return d}};
const today=()=>new Date().toLocaleDateString('en-CA');
const allRecords=()=>Object.entries(state.days).flatMap(([key,v])=>{let [c,g,d];try{[c,g,d]=JSON.parse(key)}catch(e){return []}if(c!==state.center||!v.approved)return [];return (v.absent||[]).map(name=>({g,d,name,key:JSON.stringify([c,g,d,name])}))});
const field=(label,html)=>`<div><label>${label}</label>${html}</div>`;
const sel=(arr,selected)=>arr.map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('');
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('centerTitle').textContent=state.center;document.getElementById('view').innerHTML=({home,attendance,absences,reports,rosters,settings})[tab]();}
function home(){const ds=groups().map(g=>({g,n:people(g).length,r:rec(chosenDate,g)}));const done=ds.filter(x=>x.r?.approved).length, absent=ds.reduce((n,x)=>n+(x.r?.approved?x.r.absent.length:0),0),total=ds.reduce((n,x)=>n+x.n,0);return `<div class="card"><div class="filters">${field('تاريخ المتابعة',`<input type="date" value="${chosenDate}" onchange="chosenDate=this.value;render()">`)}<div><label>التاريخ الهجري</label><div class="notice">${hdate(chosenDate)}</div></div></div></div><div class="grid"><div class="card metric"><small>إجمالي المسجلات</small><strong>${total}</strong></div><div class="card metric"><small>الكشوف المعتمدة</small><strong>${done} / ${ds.length}</strong></div><div class="card metric"><small>الغائبات اليوم</small><strong>${absent}</strong></div><div class="card metric"><small>حالات الغياب المسجلة</small><strong>${allRecords().length}</strong></div></div><div class="card"><h2>متابعة إنجاز الرصد اليومي</h2><div class="notice">لا يُحتسب الحضور قبل اعتماد كشف الفئة. عند الاعتماد، تُعتبر غير المحددات في قائمة الغياب حاضرات.</div><div class="tablewrap"><table><thead><tr><th>الفئة</th><th>المسجلات</th><th>الحاضرات</th><th>الغائبات</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${ds.map(x=>`<tr><td>${esc(x.g)}</td><td>${x.n}</td><td>${x.r?.approved?x.n-x.r.absent.length:'—'}</td><td>${x.r?.approved?x.r.absent.length:'—'}</td><td><span class="pill ${x.r?.approved?'ok':'warn'}">${x.r?.approved?'مكتمل':'لم يُرصد'}</span></td><td><button class="secondary" onclick="chosenGroup='${esc(x.g)}';tab='attendance';render()">فتح الكشف</button></td></tr>`).join('')}</tbody></table></div></div>`}
function attendance(){if(!groups().includes(chosenGroup))chosenGroup=groups()[0];const r=rec(chosenDate,chosenGroup),list=people(chosenGroup);return `<div class="card"><h2>تسجيل الغياب اليومي</h2><div class="filters">${field('التاريخ',`<input type="date" value="${chosenDate}" onchange="chosenDate=this.value;render()">`)}${field('الفئة',`<select onchange="chosenGroup=this.value;render()">${sel(groups(),chosenGroup)}</select>`)}<div><label>التاريخ الهجري</label><div class="notice">${hdate(chosenDate)}</div></div></div><div class="notice">حددي الغائبات فقط، ثم اضغطي «اعتماد الكشف». يمكن إعادة فتح اليوم لتعديل الغياب، مع الاحتفاظ بالأسباب المسجلة للأسماء التي ما زالت غائبة.</div><div class="actions"><button onclick="approve()">${r?.approved?'حفظ التعديل وإعادة الاعتماد':'اعتماد كشف اليوم'}</button><button class="secondary" onclick="toggleAll(false)">إلغاء جميع التحديدات</button><span class="pill ${r?.approved?'ok':'warn'}">${r?.approved?'معتمد':'غير معتمد'}</span></div><div class="tablewrap"><table><thead><tr><th>م</th><th>الاسم</th><th>رقم التواصل</th><th>غائبة؟</th></tr></thead><tbody>${list.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td dir="ltr">${esc(p.phone)}</td><td><label class="checkrow"><input class="absent-check" type="checkbox" value="${i}" ${(r?.absent||[]).includes(p.name)?'checked':''}><span>تحديد الغياب</span></label></td></tr>`).join('')}</tbody></table></div></div>`}
function toggleAll(v){document.querySelectorAll('.absent-check').forEach(c=>c.checked=v)}
function approve(){const absent=[...document.querySelectorAll('.absent-check:checked')].map(c=>people(chosenGroup)[+c.value].name);if(!confirm(`اعتماد كشف ${chosenGroup} بتاريخ ${hdate(chosenDate)}؟\nعدد الغائبات: ${absent.length}`))return;state.days[id(chosenDate,chosenGroup)]={approved:true,absent,updated:new Date().toISOString()};save();render()}
const reasons=['','مرض','موعد طبي','ظرف عائلي','سفر','مواصلات','طقس','بدون عذر','أخرى'];
function absences(){const records=allRecords().filter(r=>(chosenGroup==='الكل'||r.g===chosenGroup)&&(!search||r.name.includes(search)||r.d.includes(search))).sort((a,b)=>b.d.localeCompare(a.d));return `<div class="card"><h2>سجل الغياب وأسبابه</h2><div class="filters">${field('الفئة',`<select onchange="chosenGroup=this.value;render()">${sel(['الكل',...groups()],chosenGroup)}</select>`)}${field('بحث بالاسم أو التاريخ',`<input value="${esc(search)}" oninput="search=this.value;render()" placeholder="بحث...">`)}</div><div class="notice">كل غياب معتمد يظهر هنا تلقائيًا. الأسباب والملاحظات مرتبطة باسم الدارسة وتاريخ الغياب، ولا تتغير عند تسجيل أيام جديدة.</div><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>الفئة</th><th>الاسم</th><th>سبب الغياب</th><th>العذر</th><th>إجراء المتابعة</th><th>ملاحظات</th></tr></thead><tbody>${records.length?records.map(r=>{const a=state.reasons[r.key]||{};const k=encodeURIComponent(r.key);return `<tr><td>${hdate(r.d)}<br><small>${r.d}</small></td><td>${esc(r.g)}</td><td>${esc(r.name)}</td><td><select onchange="updateReason('${k}','reason',this.value)">${reasons.map(v=>`<option value="${v}" ${a.reason===v?'selected':''}>${v||'اختاري السبب'}</option>`).join('')}</select></td><td><select onchange="updateReason('${k}','excuse',this.value)">${sel(['','بعذر','بدون عذر','قيد التحقق'],a.excuse||'')}</select></td><td><select onchange="updateReason('${k}','follow',this.value)">${sel(['','لم يتم التواصل','تم التواصل','بانتظار الرد','أغلقت المتابعة'],a.follow||'')}</select></td><td><input value="${esc(a.note||'')}" onchange="updateReason('${k}','note',this.value)" placeholder="ملاحظات"></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">لا توجد حالات غياب مطابقة</td></tr>'}</tbody></table></div></div>`}
function updateReason(k,f,v){const key=decodeURIComponent(k);state.reasons[key]||={};state.reasons[key][f]=v;save()}
function reports(){const rr=allRecords(),summary=groups().map(g=>{const approved=Object.entries(state.days).filter(([k,v])=>{try{const [c,gg]=JSON.parse(k);return c===state.center&&gg===g&&v.approved}catch(e){return false}});const total=approved.reduce((s,[,v])=>s+people(g).length,0),abs=approved.reduce((s,[,v])=>s+v.absent.length,0);return {g,days:approved.length,total,abs,rate:total?((total-abs)/total*100).toFixed(1):'—'}});const count={};rr.forEach(r=>count[r.name+'|'+r.g]=(count[r.name+'|'+r.g]||0)+1);const repeated=Object.entries(count).filter(([,n])=>n>=state.threshold).sort((a,b)=>b[1]-a[1]);const cause={};rr.forEach(r=>{let x=state.reasons[r.key]?.reason||'غير محدد';cause[x]=(cause[x]||0)+1});return `<div class="grid">${summary.map(x=>`<div class="card metric"><small>${esc(x.g)} · ${x.days} يوم مرصود</small><strong>${x.rate}${x.rate==='—'?'':'%'}</strong><small>${x.abs} غياب من ${x.total} فرصة حضور</small></div>`).join('')}</div><div class="card"><h2>مؤشرات الفئات</h2><div class="actions"><button onclick="exportCSV()">تصدير الغياب CSV</button><button class="secondary" onclick="window.print()">طباعة التقرير</button></div><div class="tablewrap"><table><thead><tr><th>الفئة</th><th>الأيام المعتمدة</th><th>فرص الحضور</th><th>الغياب</th><th>نسبة الحضور</th></tr></thead><tbody>${summary.map(x=>`<tr><td>${x.g}</td><td>${x.days}</td><td>${x.total}</td><td>${x.abs}</td><td>${x.rate}${x.rate==='—'?'':'%'}</td></tr>`).join('')}</tbody></table></div></div><div class="split"><div class="card"><h2>تنبيه الغياب المتكرر (${state.threshold} أيام فأكثر)</h2>${repeated.length?repeated.map(([k,n])=>`<p><span class="pill danger">${n} أيام</span> ${esc(k.replace('|',' · '))}</p>`).join(''):'<p class="muted">لا توجد حالات تجاوزت الحد بعد.</p>'}</div><div class="card"><h2>توزيع أسباب الغياب</h2>${Object.entries(cause).map(([k,v])=>`<p>${esc(k)} <strong style="float:left">${v}</strong></p>`).join('')||'<p class="muted">لا توجد بيانات بعد.</p>'}</div></div>`}
function rosters(){if(!groups().includes(chosenGroup))chosenGroup=groups()[0];return `<div class="card"><h2>إدارة قوائم الدارسات والأطفال</h2><div class="filters">${field('الفئة',`<select onchange="chosenGroup=this.value;render()">${sel(groups(),chosenGroup)}</select>`)}<button onclick="addPerson()">+ إضافة اسم</button></div><div class="notice">الأسماء والأرقام مستوردة من القوائم المرفقة. راجعي أرقام التواصل غير المكتملة في المصدر قبل استخدامها.</div><div class="tablewrap"><table><thead><tr><th>م</th><th>الاسم</th><th>رقم التواصل</th><th>إجراء</th></tr></thead><tbody>${people(chosenGroup).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td dir="ltr">${esc(p.phone)}</td><td><button class="secondary" onclick="editPerson(${i})">تعديل</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addPerson(){let name=prompt('اسم الدارسة/الطفل');if(!name?.trim())return;let phone=prompt('رقم التواصل (يمكن تركه فارغًا)')||'';people(chosenGroup).push({name:name.trim(),phone:phone.trim()});save();render()}
function editPerson(i){let p=people(chosenGroup)[i],name=prompt('الاسم',p.name);if(name===null||!name.trim())return;let phone=prompt('رقم التواصل',p.phone);if(phone===null)return;if(name.trim()!==p.name&&Object.values(state.days).some(r=>r.absent?.includes(p.name)))alert('تنبيه: تغيير اسم دارسة لها غياب سابق قد يفصل سجلاتها القديمة؛ يفضّل إبقاء الاسم نفسه عند وجود غياب.');p.name=name.trim();p.phone=phone.trim();save();render()}
function settings(){return `<div class="card"><h2>المراكز والإعدادات</h2><div class="filters">${field('المركز الحالي',`<select onchange="state.center=this.value;chosenGroup=groups()[0];save();render()">${sel(Object.keys(state.centers),state.center)}</select>`)}<button onclick="addCenter()">+ إضافة مركز</button>${field('حد تنبيه الغياب المتكرر',`<input type="number" min="1" max="100" value="${state.threshold}" onchange="state.threshold=Math.max(1,Number(this.value)||3);save()">`)}</div><div class="notice">عند إضافة مركز جديد يبدأ بقوائم فارغة. المركز الحالي هو الوحيد الذي تظهر بياناته في الصفحات.</div></div><div class="card"><h2>النسخ الاحتياطي وحماية البيانات</h2><div class="notice"><strong>مهم:</strong> هذه نسخة تعمل محليًا داخل المتصفح، وليست منصة سحابية. لا تتزامن البيانات بين الأجهزة، وقد تضيع إذا حُذفت بيانات المتصفح. صدّري نسخة احتياطية بانتظام، ولا ترفعي ملف النسخة الاحتياطية إلى مكان عام لأنه يحتوي أسماء وأرقام تواصل.</div><div class="actions"><button onclick="backup()">تنزيل نسخة احتياطية JSON</button><button class="secondary" onclick="document.getElementById('restore').click()">استعادة نسخة احتياطية</button><input class="hidden" id="restore" type="file" accept=".json" onchange="restore(event)"></div></div>`}
function addCenter(){const n=prompt('اسم المركز الجديد');if(!n?.trim())return;if(state.centers[n])return alert('المركز موجود');state.centers[n]={'الأمهات':[],'المتعلمات':[],'الناشئة':[],'التمهيدي':[]};state.center=n;chosenGroup='الأمهات';save();render()}
function download(name,content,type){const blob=new Blob([content],{type}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function backup(){download('انتظام_نسخة_احتياطية_'+today()+'.json',JSON.stringify(state,null,2),'application/json')}
function restore(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(!d.centers||!d.days||!d.center||!d.centers[d.center])throw Error();if(!confirm('ستُستبدل جميع البيانات الحالية بمحتوى النسخة. هل أنت متأكدة؟'))return;state=d;save();render();alert('تمت الاستعادة')}catch(err){alert('ملف النسخة الاحتياطية غير صالح')}};reader.readAsText(f)}
function exportCSV(){const rows=[['المركز','الفئة','التاريخ الميلادي','التاريخ الهجري','الاسم','سبب الغياب','نوع العذر','المتابعة','ملاحظات']];allRecords().forEach(r=>{const a=state.reasons[r.key]||{};rows.push([state.center,r.g,r.d,hdate(r.d),r.name,a.reason||'',a.excuse||'',a.follow||'',a.note||''])});const csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');download('انتظام_سجل_الغياب_'+today()+'.csv',csv,'text/csv;charset=utf-8')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;if(tab==='absences')chosenGroup='الكل';if(tab==='attendance'&&!groups().includes(chosenGroup))chosenGroup=groups()[0];render()});render();
</script></body></html>
